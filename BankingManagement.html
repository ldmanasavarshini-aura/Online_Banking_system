<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Banking Portal</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary-blue: #3b82f6;
            --success-green: #10b981;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--primary-blue);
            margin: 0;
            font-size: 26px;
        }

        .grid-layout {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .panel h2 {
            margin-top: 0;
            font-size: 18px;
            color: var(--text-light);
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
        }

        .input-box {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid #334155;
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--primary-blue);
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-blue { background-color: var(--primary-blue); }
        .btn-blue:hover { background-color: #1d4ed8; }
        .btn-green { background-color: var(--success-green); }
        .btn-green:hover { background-color: #047857; }

        .full-width {
            grid-column: span 2;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            color: var(--text-muted);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Secure Digital Banking</h1>
        <div style="color: var(--success-green);">● Active UI Playground</div>
    </div>

    <div class="grid-layout">
        <div class="panel">
            <h2>Create Member Account</h2>
            <div class="input-box">
                <label>Account Number</label>
                <input type="text" id="regAccNum" placeholder="Assign Account ID">
            </div>
            <div class="input-box">
                <label>Account Holder Name</label>
                <input type="text" id="regName" placeholder="Full Legal Name">
            </div>
            <div class="input-box">
                <label>Opening Balance ($)</label>
                <input type="number" id="regBalance" placeholder="0.00">
            </div>
            <button class="btn-green" onclick="openAccount()">Open Account</button>
        </div>

        <div class="panel">
            <h2>Transfer Ledger Entry</h2>
            <div class="input-box">
                <label>Sender Account ID</label>
                <input type="text" id="sendId" placeholder="From Acc">
            </div>
            <div class="input-box">
                <label>Receiver Account ID</label>
                <input type="text" id="recvId" placeholder="To Acc">
            </div>
            <div class="input-box">
                <label>Amount to Send ($)</label>
                <input type="number" id="sendAmount" placeholder="0.00">
            </div>
            <button class="btn-blue" onclick="executeTransfer()">Execute Transfer</button>
        </div>

        <div class="panel full-width">
            <h2>Live Transaction Statement Logger</h2>
            <table>
                <thead>
                    <tr>
                        <th>Transaction ID</th>
                        <th>Type Reference</th>
                        <th>Amount Delta</th>
                        <th>Ending Balance</th>
                    </tr>
                </thead>
                <tbody id="statementTableBody">
                    <tr>
                        <td>TXN-101</td>
                        <td>INITIAL_DEPOSIT</td>
                        <td style="color: var(--success-green);">+$5,000.00</td>
                        <td>$5,000.00</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Mock database in browser memory
        let localDatabase = {
            "714025205089": { name: "manasa", balance: 5000.00 }
        };

        function openAccount() {
            const accNum = document.getElementById('regAccNum').value.trim();
            const name = document.getElementById('regName').value.trim();
            const balanceInput = document.getElementById('regBalance').value;
            const balance = parseFloat(balanceInput);

            if (!accNum || !name || isNaN(balance)) {
                alert("Please fill out all fields under 'Create Member Account'!");
                return;
            }

            // Save to browser memory map
            localDatabase[accNum] = { name: name, balance: balance };

            // Update the UI Table below instantly
            const tableBody = document.getElementById('statementTableBody');
            const randomTxnId = "TXN-" + Math.floor(100 + Math.random() * 900);
            
            const newRowHtml = `
                <tr>
                    <td>${randomTxnId}</td>
                    <td>INITIAL_DEPOSIT</td>
                    <td style="color: var(--success-green);">+$${balance.toFixed(2)}</td>
                    <td>$${balance.toFixed(2)}</td>
                </tr>
            `;
            tableBody.innerHTML += newRowHtml;

            alert(`Success! Account registered for ${name}.`);
        }

        function executeTransfer() {
            const sender = document.getElementById('sendId').value.trim();
            const receiver = document.getElementById('recvId').value.trim();
            const amtInput = document.getElementById('sendAmount').value;
            const amount = parseFloat(amtInput);

            if (!sender || !receiver || isNaN(amount)) {
                alert("Please fill out all fields under 'Transfer Ledger Entry'!");
                return;
            }

            // Simple validation check
            if (!localDatabase[receiver]) {
                alert(`Receiver Account ID (${receiver}) does not exist in active records yet! Use the left panel to register them first.`);
                return;
            }

            // Execute fake transfer calculation
            localDatabase[receiver].balance += amount;

            // Log the transfer directly into the visual table below
            const tableBody = document.getElementById('statementTableBody');
            const randomTxnId = "TXN-" + Math.floor(100 + Math.random() * 900);
            
            const newRowHtml = `
                <tr>
                    <td>${randomTxnId}</td>
                    <td>TRANSFER_IN (To: ${localDatabase[receiver].name})</td>
                    <td style="color: var(--success-green);">+$${amount.toFixed(2)}</td>
                    <td>$${localDatabase[receiver].balance.toFixed(2)}</td>
                </tr>
            `;
            tableBody.innerHTML += newRowHtml;

            alert("Transfer operation executed and logged successfully!");
        }
    </script>
</body>
</html>
